services:
  - type: web
    name: daily-streak-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: INTEGRATION_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: INTEGRATION_ADMIN_SECRET
        generateValue: true