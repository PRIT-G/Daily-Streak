name: PR Review Bot

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PR-Agent review
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure one provider key in repo Settings > Secrets and variables > Actions
          # For OpenAI: set OPENAI_KEY secret
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          # Optional: choose model (examples depend on provider/key)
          # OPENAI_MODEL: gpt-4o
          # PR-Agent config: auto actions on PR events
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
